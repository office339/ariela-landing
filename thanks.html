<!DOCTYPE html>

<link rel="stylesheet" href="styles2.css">
<style>
  /* ---- דף-תודה: נשען כולו על styles2.css; רק כיוונונים ספציפיים-לדף ---- */
  /* sticky-footer: הפוטר יושב בתחתית המסך גם כשהתוכן קצר — בלי לגלול */
  body{min-height:100svh;display:flex;flex-direction:column}
  .thanks{flex:1 0 auto;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:clamp(108px,14vw,160px) 24px clamp(56px,7vw,92px)}
  .thanks-bg{position:absolute;inset:0;z-index:0;overflow:hidden;
    background:linear-gradient(180deg,var(--lav-100),var(--lav-50) 46%,var(--paper))}
  .thanks-in{position:relative;z-index:2;width:100%;max-width:640px;margin-inline:auto}
  .thanks-in .form-success{padding:4px 0 0}
  .thanks-in .big{width:108px;height:108px;margin-bottom:24px}
  .thanks-in .big svg{width:54px;height:54px}
  .thanks-in h1{font-family:var(--head);font-size:clamp(28px,4.3vw,42px);font-weight:600;line-height:1.2;margin-bottom:16px}
  .thanks-sub{font-size:clamp(16px,2vw,19px);color:var(--ink-soft);line-height:1.7;margin-bottom:16px}
  .thanks-note{font-size:15px;color:var(--ink-faint);margin-bottom:8px}
  .thanks-actions{display:flex;flex-direction:column;gap:12px;margin-top:26px}
  @media (min-width:560px){.thanks-actions{flex-direction:row;justify-content:center}.thanks-actions .btn{flex:1}}
  .thanks-footer .footer-in{justify-content:center;text-align:center}
  .thanks-footer .fcol{display:flex;flex-direction:column;align-items:center}
  .thanks-footer .fcol p{margin-inline:auto}

  <div class="thanks-in">
    <div class="form-card">
      <span class="ribbon"></span>
      <div class="form-success show">
        <div class="big">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1>תודה! הפרטים נקלטו בהצלחה</h1>
        <p class="thanks-sub">אריאלה תחזור אליכם בהקדם לתיאום שיחת ייעוץ והתאמה — ללא עלות וללא התחייבות.</p>
        <p class="thanks-note">בינתיים, אם נוח לכם — אפשר לכתוב לנו ישירות בוואטסאפ.</p>
        <div class="thanks-actions">
          <a class="btn btn-wa" href="https://wa.me/972545673063" target="_blank" rel="noopener">
            <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm5.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></svg>
            כתבו לנו בוואטסאפ
          </a>
          <a class="btn btn-ghost" href="index.html">חזרה לדף הבית</a>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer class="footer thanks-footer" data-screen-label="footer">
  <div class="footer-in">
    <div class="fcol">
      <img src="assets/logo.png" alt="אריאלה — המכון לשיפור יכולות למידה">
      <p>המכון של אריאלה · פתח תקווה, גבול גבעת שמואל · גילאי 6–10</p>
    </div>
  </div>
</footer>
